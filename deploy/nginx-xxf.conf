server {
    listen 80;
    listen [::]:80;
    server_name xxf.app www.xxf.app;
    return 301 https://www.xxf.app$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name xxf.app;

    ssl_certificate /www/server/panel/vhost/cert/xxf.app/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/xxf.app/privkey.pem;
    return 301 https://www.xxf.app$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.xxf.app;

    root /www/wwwroot/xxf.app/current;
    index index.html;

    ssl_certificate /www/server/panel/vhost/cert/xxf.app/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/xxf.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:XXFSSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; upgrade-insecure-requests" always;

    location /_next/static/ {
        try_files $uri =404;
        expires 365d;
    }

    location ~* \.(?:png|jpg|jpeg|gif|webp|avif|ico|woff2)$ {
        try_files $uri =404;
        expires 30d;
    }

    location ~* \.(?:html|xml|txt|webmanifest)$ {
        try_files $uri $uri/ $uri/index.html =404;
        expires -1;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    access_log /www/wwwlogs/xxf.app.log;
    error_log /www/wwwlogs/xxf.app.error.log;
}
